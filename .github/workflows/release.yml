name: Release package (approval required)
on: {workflow_dispatch: {inputs: {publish: {description: 'Publish after protected approval', required: true, default: false, type: boolean}}}}
permissions: {contents: read, id-token: write}
jobs:
  package:
    runs-on: windows-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12.0', registry-url: 'https://registry.npmjs.org'}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run --json
      - if: ${{ inputs.publish }}
        run: npm publish --provenance --access public
