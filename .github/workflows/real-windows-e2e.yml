name: Real Windows Codex E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnicodex-real-windows-e2e
  cancel-in-progress: false

jobs:
  installed-runtime:
    runs-on: [self-hosted, Windows, X64, omnicodex-e2e]
    environment: real-windows-e2e
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify installed Codex full surface and non-interference
        run: npm run test:live:runtime
      - name: Verify authenticated hidden daemon lifecycle
        run: npm run test:live:daemon
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
