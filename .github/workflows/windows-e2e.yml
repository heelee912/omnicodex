name: Windows isolated E2E
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  isolated-contract:
    runs-on: windows-latest
    environment: isolated-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12.0', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Run fake runtime and fake CDP contracts only
        run: npm test
        env:
          OMNICODEX_REAL_RUNTIME_E2E: '0'
          OMNICODEX_REAL_CHROME_E2E: '0'
      - name: Assert no user app lane
        shell: pwsh
        run: if ($env:OMNICODEX_REAL_RUNTIME_E2E -ne '0') { throw 'User runtime access forbidden in hosted CI' }
