name: Windows isolated E2E
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  isolated-contract:
    runs-on: windows-latest
    environment: isolated-e2e
    env:
      OMNICODEX_REAL_RUNTIME_E2E: '0'
      OMNICODEX_REAL_CHROME_E2E: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.14.0', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Run fake runtime and fake CDP contracts only
        shell: pwsh
        run: |
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is missing' }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert no user app lane
        shell: pwsh
        run: if ($env:OMNICODEX_REAL_RUNTIME_E2E -ne '0') { throw 'User runtime access forbidden in hosted CI' }
